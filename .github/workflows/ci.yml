name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: minidify
          POSTGRES_PASSWORD: minidify
          POSTGRES_DB: minidify
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U minidify"
          --health-interval 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql+asyncpg://minidify:minidify@localhost:5432/minidify
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --locked

      - name: Enable pgvector
        run: psql postgresql://minidify:minidify@localhost:5432/minidify -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        run: uv run pytest -v