services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: minidify
      POSTGRES_PASSWORD: minidify
      POSTGRES_DB: minidify
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minidify"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata: