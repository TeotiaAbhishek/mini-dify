[project]
name = "mini-dify"
version = "0.1.0"
description = "A small Dify-style LLM app platform, built to learn"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.5",
    "httpx>=0.28.1",
    "pgvector>=0.5.1",
    "pydantic-settings>=2.16.2",
    "pypdf>=7.0.1",
    "python-multipart>=0.0.33",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# conftest.py must set DATABASE_URL before anything imports the settings.
"tests/conftest.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
